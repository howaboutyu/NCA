# Dodrio experiment: sobel_second plus gated 8x8 token attention, seeded by a
# compact Poké Ball icon rather than a single point or random live-cell mask.
dimensions: [56, 56]
model_output_len: 16
perception_method: sobel_second
nonlocal_connections: true
nonlocal_mode: token_attention
nonlocal_token_grid: 8
nonlocal_attention_dim: 32
seed_pattern: pokeball
seed_size: 11
seed_density: 0.0
seed_random_seed: 0
batch_size: 4
pool_size: 1000
total_training_steps: 100000
num_nca_steps: 64
total_eval_steps: 300
learning_rate: 0.0001
n_damage: 1
target_filename: "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/dodrio.png"
weights_dir: ""
checkpoint_dir: "runs/dodrio_56x56_sobel_second_token_attention_pokeball/checkpoints"
validation_video_dir: "runs/dodrio_56x56_sobel_second_token_attention_pokeball/validation_videos"
log_dir: "runs/dodrio_56x56_sobel_second_token_attention_pokeball/logs"
evaluation_video_file: "runs/dodrio_56x56_sobel_second_token_attention_pokeball/evaluation.mp4"
checkpoint_every: 500
eval_every: 500
log_every: 500
