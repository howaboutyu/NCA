# Continue checkpoint 119501 with a regeneration-focused damage curriculum.
dimensions: [64, 64]
model_output_len: 64
perception_method: learned
nonlocal_connections: false
nonlocal_mode: global
edge_count: 0
state_clip: 16.0
pokemon_embedding_dim: 32
pokemon_targets:
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/bulbasaur.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/charmander.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/squirtle.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/pikachu.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/eevee.png"
seed_pattern: pokeball
seed_size: 11
seed_density: 0.0
seed_noise_density: 0.25
seed_random_seed: 0
stochastic_update_prob: 0.5
batch_size: 8
pool_size: 1000
total_training_steps: 180000
num_nca_steps: 64
total_eval_steps: 300
learning_rate: 0.0001

# Damage half of every batch. Repeating left_side gives it 60% strategy
# probability, so 30% of all batch items receive a large left-side cutout.
n_damage: 4
train_cutout_strategies:
  - "left_side"
  - "left_side"
  - "left_side"
  - "circle"
  - "square"
train_cutout_square_height_factor_range: [0.20, 0.50]
train_cutout_square_width_factor_range: [0.20, 0.50]
train_cutout_left_width_factor_range: [0.35, 0.70]
train_cutout_noise_probability: 0.25
train_cutout_noise_scale: [0.0, 0.25]

inference_apply_cutout: true
inference_cutout_strategies:
  - "left_side"
inference_cutout_left_width_factor_range: [0.50, 0.50]
inference_cutout_noise_probability: 0.0

target_filename: "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/dodrio.png"
weights_dir: "/mnt/ssd1/data/git/NCA-expa-worktree/runs/conditional_pokemon_learned_64ch_64x64_nosyn_fresh/checkpoints"
checkpoint_dir: "/mnt/ssd1/data/git/NCA/runs/conditional_pokemon_strong_cutout_resume/checkpoints"
validation_video_dir: "/mnt/ssd1/data/git/NCA/runs/conditional_pokemon_strong_cutout_resume/validation_videos"
log_dir: "/mnt/ssd1/data/git/NCA/runs/conditional_pokemon_strong_cutout_resume/logs"
evaluation_video_file: "/mnt/ssd1/data/git/NCA/runs/conditional_pokemon_strong_cutout_resume/evaluation.mp4"
checkpoint_every: 500
eval_every: 500
log_every: 500
