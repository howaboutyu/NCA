# Shared Dodrio-family experiment: one global-context NCA conditioned on a
# learned Pokémon identity embedding.
dimensions: [56, 56]
model_output_len: 16
perception_method: learned
nonlocal_connections: true
nonlocal_mode: moving_edges
edge_count: 4
edge_state_dim: 16
edge_momentum: 0.9
edge_step_size: 0.05
edge_state_step_size: 0.05
edge_message_scale: 0.25
edge_visualization_stride: 8
state_clip: 16.0
pokemon_embedding_dim: 32
pokemon_targets:
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/bulbasaur.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/charmander.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/squirtle.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/pikachu.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/eevee.png"
seed_pattern: pokeball
seed_size: 11
seed_density: 0.0
seed_noise_density: 0.25
seed_random_seed: 0
stochastic_update_prob: 0.5
batch_size: 8
pool_size: 1000
total_training_steps: 100000
num_nca_steps: 64
total_eval_steps: 300
learning_rate: 0.0001
n_damage: 1
target_filename: "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/dodrio.png"
weights_dir: ""
checkpoint_dir: "runs/conditional_pokemon_moving_edges_learned_pokeball_noise25_stoch50/checkpoints"
validation_video_dir: "runs/conditional_pokemon_moving_edges_learned_pokeball_noise25_stoch50/validation_videos"
log_dir: "runs/conditional_pokemon_moving_edges_learned_pokeball_noise25_stoch50/logs"
evaluation_video_file: "runs/conditional_pokemon_moving_edges_learned_pokeball_noise25_stoch50/evaluation.mp4"
checkpoint_every: 500
eval_every: 500
log_every: 500
