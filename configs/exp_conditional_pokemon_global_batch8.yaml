# Shared Dodrio-family experiment: one global-context NCA conditioned on a
# learned Pokémon identity embedding.
dimensions: [56, 56]
model_output_len: 16
perception_method: sobel_second
nonlocal_connections: true
nonlocal_mode: global
pokemon_embedding_dim: 32
dynamic_class_token: true
class_token_scale: 4.0
pokemon_targets:
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/bulbasaur.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/charmander.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/squirtle.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/pikachu.png"
  - "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/eevee.png"
seed_pattern: pokeball
seed_size: 11
seed_density: 0.0
seed_random_seed: 0
batch_size: 8
pool_size: 1000
total_training_steps: 100000
num_nca_steps: 64
total_eval_steps: 300
learning_rate: 0.0001
n_damage: 1
target_filename: "/mnt/ssd1/data/git/NCA/data/pokemon_emoji/emojis/dodrio.png"
weights_dir: "runs/conditional_pokemon_global_batch8_dynamic/checkpoints"
checkpoint_dir: "runs/conditional_pokemon_global_batch8_dynamic/checkpoints"
validation_video_dir: "runs/conditional_pokemon_global_batch8_dynamic/validation_videos"
log_dir: "runs/conditional_pokemon_global_batch8_dynamic/logs"
evaluation_video_file: "runs/conditional_pokemon_global_batch8_dynamic/evaluation.mp4"
checkpoint_every: 500
eval_every: 500
log_every: 500
